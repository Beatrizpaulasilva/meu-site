kind = "web"
previewPath = "/"
title = "Achadinhos da Bia"
description = "Uma vitrine responsiva de produtos selecionados para casa, cozinha e quarto, com busca, filtros por categoria e links individuais de afiliado do Mercado Livre."
version = "1.0.0"
id = "artifacts/achadinhos-da-bia"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20925

[services.development]
run = "pnpm --filter @workspace/achadinhos-da-bia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/achadinhos-da-bia", "run", "build" ]
serve = "static"
publicDir = "artifacts/achadinhos-da-bia/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20925"
BASE_PATH = "/"
